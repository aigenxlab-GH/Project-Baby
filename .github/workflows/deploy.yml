name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Sanity Studio
        id: sanity_build
        run: node_modules/.bin/sanity build --yes 2>&1
        continue-on-error: true
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: mnwolxvz
          NEXT_PUBLIC_SANITY_DATASET: production

      - name: Deploy Sanity Studio
        if: steps.sanity_build.outcome == 'success'
        run: node_modules/.bin/sanity deploy --no-build --yes 2>&1
        continue-on-error: true
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: mnwolxvz
          NEXT_PUBLIC_SANITY_DATASET: production

      - name: Build & Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          # 1,542 prerendered pages plus the 2.6 MB SSA name-stats dataset push
          # the build past Node's default heap — without this the build worker
          # dies with exit code 3221226505 / OOM during "Collecting page data".
          NODE_OPTIONS: --max-old-space-size=8192
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ca-pub-9203095207294518
          NEXT_PUBLIC_ADSENSE_SLOT_HEADER: "1378297902"
          NEXT_PUBLIC_ADSENSE_SLOT_CONTENT: "8027761881"
          NEXT_PUBLIC_ADSENSE_SLOT_FOOTER: "7889036797"
          NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: "5125971221"
          NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE: "1186726216"

      # Pages are served with long-lived edge cache headers (s-maxage=1yr), so a
      # deploy that fixes/publishes content doesn't reach visitors or Googlebot
      # until Cloudflare's cache naturally expires (up to a year) unless purged.
      # Uses a dedicated minimal-scope token (Zone > Cache Purge > Purge only) —
      # the shared deploy token's edited permissions never actually took effect
      # after 3 attempts, so this sidesteps that entirely.
      - name: Purge Cloudflare cache
        if: ${{ env.CLOUDFLARE_ZONE_ID != '' }}
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          # Trim whitespace/newlines that copy-pasting a secret value can silently introduce.
          ZONE_ID=$(echo -n "$CLOUDFLARE_ZONE_ID" | tr -d '[:space:]')
          TOKEN=$(echo -n "$CLOUDFLARE_PURGE_TOKEN" | tr -d '[:space:]')
          echo "Zone ID length: ${#ZONE_ID} (expect 32)"
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail-with-body
